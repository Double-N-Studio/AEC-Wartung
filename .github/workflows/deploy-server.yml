name: Deploy to VPS

# Builds the app image (backend + frontend), pushes it to GHCR, copies backend/ to the VPS and restarts Compose.
# Runs when the server or the frontend changed. GitHub Pages keeps the demo (deploy.yml).
# Secret DEPLOY_SSH_KEY: private key of the "deploy" user (see backend/setup/deploy-user.sh).
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   IMAGE            image name, default ghcr.io/<owner>/<repo>-server (lowercase)
#   DEPLOY_HOST      server address; without it only the image is built, nothing is deployed
#   DEPLOY_HOST_KEY  line for known_hosts, e.g. "1.2.3.4 ssh-ed25519 AAAA…" (ssh-keyscan <host>)
#   APP_URL          public address for the health check, e.g. https://wartung.example.org

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

env:
  HOST: ${{ vars.DEPLOY_HOST }}
  # Host key of the server, so the connection doesn't trust on first use.
  HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
  APP_URL: ${{ vars.APP_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          IMAGE: ${{ vars.IMAGE }}
        run: echo "image=${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}-server}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Copy files
        run: rsync -az --delete --exclude data/ --exclude node_modules/ --exclude dist/ backend/ deploy@$HOST:/srv/wartung/

      - name: Start containers
        run: ssh deploy@$HOST "cd /srv/wartung && export APP_IMAGE=$IMAGE:latest && docker compose pull --quiet && docker compose up -d --remove-orphans && docker compose ps && docker image prune -f >/dev/null"

      - name: Health check
        if: env.APP_URL != ''
        run: |
          sleep 3
          curl --fail --silent "$APP_URL/api/health"
          curl --fail --silent "$APP_URL/" | grep -q '<div id="app">'
