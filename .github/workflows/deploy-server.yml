name: Deploy server

# Builds the backend image, pushes it to GHCR, copies server/ to the VPS and restarts Compose.
# Runs only when something under server/ changed.
# Secret DEPLOY_SSH_KEY: private key of the "deploy" user (see server/setup/deploy-user.sh).

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/double-n-studio/aec-wartung-server
  HOST: 178.105.54.205
  # Host key of the VPS, so the connection doesn't trust on first use.
  HOST_KEY: '178.105.54.205 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE5mKKLBiN5JIwYJc+GPLDc4nyCM5OduuqaYliVTXgvZ'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Copy files
        run: rsync -az --delete --exclude data/ --exclude node_modules/ --exclude dist/ server/ deploy@$HOST:/srv/wartung/

      - name: Start containers
        run: ssh deploy@$HOST 'cd /srv/wartung && docker compose pull --quiet && docker compose up -d --remove-orphans && docker compose ps && docker image prune -f >/dev/null'

      - name: Health check
        run: |
          sleep 3
          curl --fail --silent https://wartung.nuno-ferreira.de/api/health
