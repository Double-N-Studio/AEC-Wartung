# Runs on the VPS under /srv/wartung (see backend/README.md).
# nginx forwards https://wartung.nuno-ferreira.de to 127.0.0.1:8081.
# The image is built by .github/workflows/deploy-server.yml on every push to main.
services:
  app:
    image: ghcr.io/double-n-studio/aec-wartung-server:latest
    restart: unless-stopped
    # APP_URL, ADMIN_NAME, ADMIN_EMAIL, NODE_ENV=production – data/ is not touched by the deploy rsync,
    # so the file survives deploys. Optional, so the container still starts without it.
    env_file:
      - path: ./data/app.env
        required: false
    ports:
      - '127.0.0.1:8081:3000'
    volumes:
      # SQLite file and uploads – deliberately on the root disk,
      # because Hetzner backups don't cover volumes.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
