# Läuft auf dem VPS unter /srv/wartung (siehe server/README.md).
# nginx leitet https://wartung.nuno-ferreira.de auf 127.0.0.1:8081 weiter.
# Das Image baut .github/workflows/deploy-server.yml bei jedem Push auf main.
services:
  app:
    image: ghcr.io/double-n-studio/aec-wartung-server:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:3000'
    volumes:
      # SQLite-Datei und Uploads – liegt bewusst auf der Root-Platte,
      # weil die Hetzner-Backups keine Volumes sichern.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
